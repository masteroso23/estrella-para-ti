<meta charset="utf-8">

<title>Una estrella para ti</title>
<style>
:root{box-sizing:border-box;--bg:#0b1233;--ink:#fff}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:Georgia,'Times New Roman',serif;-webkit-tap-highlight-color:transparent;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#txt,#end,#hint{position:fixed;left:0;right:0;text-align:center;color:var(--ink);text-shadow:0 2px 12px rgba(0,0,0,.35);padding:0 28px;pointer-events:none}
#txt{top:calc(env(safe-area-inset-top,0px) + 9vh);font-size:clamp(24px,6.4vw,42px);line-height:1.3;font-style:italic}
#txt span{opacity:0;transition:opacity 1.6s ease}
#txt span.on{opacity:1}
#txt.out{opacity:0;transition:opacity 1.2s ease}
#end{bottom:calc(env(safe-area-inset-bottom,0px) + 9vh);font-size:clamp(30px,8.5vw,56px);opacity:0;transition:opacity 2s ease;font-style:italic}
#end.on{opacity:1}
#hint{bottom:calc(env(safe-area-inset-bottom,0px) + 8vh);font-size:clamp(16px,4.2vw,22px);opacity:0;transition:opacity 1.2s ease;letter-spacing:.04em}
#hint.on{opacity:.9;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
</style>
</head>

const LIP={x:0.51,y:0.70};
let W=0,H=0,dpr=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();

/* estado de la escena */
const S={vis:0,sky:0,moon:0,stars:0,rest:1,mv:0,sr:4,glow:0,face:0,pop:0};
const stars=[];
for(let i=0;i<150;i++)stars.push({x:Math.random(),y:Math.random()*0.86,r:0.6+Math.random()*1.5,p:Math.random()*6.28,s:1+Math.random()*2,d:Math.random()});
stars[0]={x:0.72,y:0.32,r:2.4,p:0,s:1.5,d:0.5};
const hearts=[];

const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const back=t=>{const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tween(k,to,ms,fn=ease){return new Promise(res=>{const from=S[k],t0=performance.now();(function f(n){let t=Math.min((n-t0)/ms,1);S[k]=from+(to-from)*fn(t);t<1?requestAnimationFrame(f):res()})(t0)})}

/* cielo: día -> atardecer -> noche */
const TOP=[[90,169,230],[120,96,170],[5,10,36]],BOT=[[191,227,255],[250,160,140],[27,42,107]];
function mix(arr,t){const s=t*2,i=Math.min(Math.floor(s),1),f=s-i,a=arr[i],b=arr[i+1];return a.map((v,k)=>Math.round(v+(b[k]-v)*f))}
function drawSky(){const g=ctx.createLinearGradient(0,0,0,H),t=mix(TOP,S.sky),b=mix(BOT,S.sky);g.addColorStop(0,`rgb(${t})`);g.addColorStop(1,`rgb(${b})`);ctx.fillStyle='#0b1233';ctx.fillRect(0,0,W,H);ctx.globalAlpha=S.vis;ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
function drawMoon(){if(S.moon<=0.01)return;const m=Math.min(W,H),r=m*0.09,x=W*0.78,y=H*0.2-(1-S.moon)*-20;
ctx.save();ctx.globalAlpha=S.moon;const g=ctx.createRadialGradient(x,y,r*0.8,x,y,r*3);g.addColorStop(0,'rgba(255,248,210,.45)');g.addColorStop(1,'rgba(255,248,210,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,6.283);ctx.fill();
ctx.fillStyle='#f6f1d8';ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();ctx.fillStyle='rgba(190,180,140,.35)';
[[-.3,-.2,.22],[.25,.15,.16],[-.1,.4,.12]].forEach(c=>{ctx.beginPath();ctx.arc(x+c[0]*r,y+c[1]*r,c[2]*r,0,6.283);ctx.fill()});ctx.restore()}
function starPath(cx,cy,R,rot=-Math.PI/2){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,rr=i%2?R*0.5:R;ctx[i?'lineTo':'moveTo'](cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}ctx.closePath()}
function drawStars(t){
for(let i=1;i<stars.length;i++){const s=stars[i];const a=Math.max(0,Math.min(1,S.stars*1.6-s.d*0.6))*S.rest*(0.55+0.45*Math.sin(t*0.001*s.s+s.p));if(a<=0.01)continue;ctx.fillStyle=`rgba(255,255,240,${a})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()}
/* la elegida */
const s0=stars[0],cx=W/2,cy=H*0.54,x=s0.x*W+(cx-s0.x*W)*S.mv,y=s0.y*H+(cy-s0.y*H)*S.mv;
const a=Math.max(S.stars,S.mv)*(0.7+0.3*Math.sin(t*0.002));if(a<=0.01&&S.sr<6)return;
S.cx=x;S.cy=y;
ctx.save();ctx.shadowColor='rgba(255,224,120,'+(0.5+S.glow*0.5)+')';ctx.shadowBlur=10+S.glow*60+Math.sin(t*0.003)*S.glow*10;
const g=ctx.createLinearGradient(x,y-S.sr,x,y+S.sr);g.addColorStop(0,'#fff6bf');g.addColorStop(1,'#ffcf3f');ctx.fillStyle=g;ctx.globalAlpha=Math.min(1,a+S.glow);
starPath(x,y,S.sr);ctx.lineJoin='round';ctx.lineWidth=S.sr*0.08;ctx.strokeStyle='#ffe58a';ctx.stroke();ctx.fill();ctx.restore()}
function drawFace(){if(S.face<=0.01||!face.complete)return;const R=S.sr,w=R*1.18*(0.2+0.8*S.pop),h=w*face.height/face.width;
ctx.save();ctx.globalAlpha=Math.min(1,S.face);ctx.drawImage(face,S.cx-w/2,S.cy-h*0.47,w,h);ctx.restore()}
function heart(x,y,s,rot,a){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(s,s);ctx.globalAlpha=a;ctx.fillStyle='#ff5a7e';ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(-10,-4,-6,-12,0,-6);ctx.bezierCurveTo(6,-12,10,-4,0,4);ctx.fill();ctx.restore()}
function burst(n){const R=S.sr,w=R*1.18,h=w*face.height/face.width,lx=S.cx-w/2+w*LIP.x,ly=S.cy-h*0.47+h*LIP.y;
for(let i=0;i<n;i++)hearts.push({x:lx,y:ly,vx:(Math.random()-.5)*3.2,vy:-1.2-Math.random()*2.6,s:1+Math.random()*1.6,r:(Math.random()-.5)*.8,life:1,sp:0.004+Math.random()*0.004})}
function drawHearts(){for(let i=hearts.length-1;i>=0;i--){const p=hearts[i];p.x+=p.vx;p.y+=p.vy;p.vx*=0.995;p.life-=p.sp;if(p.life<=0){hearts.splice(i,1);continue}heart(p.x,p.y,p.s,p.r,Math.min(1,p.life*1.6))}}

function loop(t){ctx.clearRect(0,0,W,H);drawSky();drawMoon();drawStars(t);drawFace();drawHearts();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

/* texto */
function clear(){txt.classList.add('out');return sleep(1300).then(()=>{txt.innerHTML='';txt.classList.remove('out')})}
function add(s){const e=document.createElement('span');e.textContent=s;txt.appendChild(e);txt.appendChild(document.createTextNode(' '));void e.offsetWidth;e.classList.add('on')}
function waitTap(){return new Promise(r=>addEventListener('pointerdown',function f(){removeEventListener('pointerdown',f);r()}))}

async function show(){
hint.textContent='toca para empezar';hint.classList.add('on');await waitTap();hint.classList.remove('on');await sleep(900);
add('te mereces el cielo');tween('vis',1,3500);await sleep(5000);
tween('sky',0.5,6000);await sleep(3000);
add('la luna');tween('moon',1,3500);await sleep(4500);
add('y todas las estrellas');tween('sky',1,6000);await sleep(2500);tween('stars',1,4000);await sleep(5500);
await clear();
add('pero ahora solo puedo darte una :<');tween('rest',0,3500);tween('moon',0,3500);await sleep(3000);
tween('mv',1,3500);await sleep(4500);
await clear();
add('una que brilla de amor por ti mi yarciana');tween('sr',Math.min(W*0.42,H*0.28),3500);tween('glow',1,3500);await sleep(5500);
hint.textContent='tócala';hint.classList.add('on');await waitTap();hint.classList.remove('on');
tween('face',1,500);await tween('pop',1,900,back);burst(16);
await sleep(1200);txt.innerHTML='';endEl.classList.add('on');
for(let i=0;i<12;i++){await sleep(1100);burst(3)}
}
show();
